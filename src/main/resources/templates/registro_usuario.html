<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Montenero - Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0B1120",
                        "secondary": "#C00037",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface": "#ffffff",
                        "background": "#f8f9ff",
                        "outline-variant": "#E2E8F0"
                    },
                    "fontFamily": {
                        "inter": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .header-curve {
            border-bottom-left-radius: 120px;
        }
    </style>
</head>
<body class="bg-surface font-inter antialiased min-h-screen flex flex-col">
<!-- Top Curved Section -->
<div class="relative bg-[#0B1120] h-[40vh] min-h-[300px] flex flex-col items-center justify-center header-curve px-10">
<!-- Logo -->
<div class="mb-8">
<img alt="Montenero Logo" class="h-24 w-auto object-contain brightness-0 invert" src="https://lh3.googleusercontent.com/aida/ADBb0ujAzRTtBB5v9PRIr0Fzsf_Yg98cMYnTjDtt2hPnbh7sjcJHikMqqZABnlPIJXhmC1CcCfNCWwXKWof0_Ybg1uzRxw7fHPD3bxGQwyuG5u_JiOpM2ZPb9C8d82jvZaULukBUkf9NeyoWOD8sv2K0T2FqgjWjFBVNNP-mu-NAzpM7Ybw2Tq2gsEpkh66jEE9CoFXNZPvgHre_T9VmJWdBzYir9RKNxojVcepqPb4q7KJHnJ1iOEnXTY0JxnaSQ5EtL5LUepaL-5nA18Q">
</div>
<!-- Heading -->

</div>
<!-- Form Section -->
<main class="flex-grow px-8 pt-12 pb-10 flex flex-col items-center">
<form th:action="@{/registro}" th:object="${registroDTO}" class="w-full max-w-[340px] space-y-5" method="POST">
<!-- Fullname -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#94A3B8] text-[20px]">person</span>
</div>
<input th:field="*{fullName}" class="w-full bg-white border border-gray-100 rounded-full py-4 pl-12 pr-4 text-[15px] text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/5 shadow-lg shadow-gray-100 transition-all" placeholder="Nombre completo" required="" type="text">
</div>
<p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-red-500 text-xs px-4"></p>

<!-- Email -->
<div class="relative group mt-4">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#94A3B8] text-[20px]">email</span>
</div>
<input th:field="*{email}" class="w-full bg-white border border-gray-100 rounded-full py-4 pl-12 pr-4 text-[15px] text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/5 shadow-lg shadow-gray-100 transition-all" placeholder="Correo electrónico" required="" type="email">
</div>
<p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs px-4"></p>

<!-- Phone Number -->
<div class="relative group mt-4">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#94A3B8] text-[20px]">phone</span>
</div>
<input th:field="*{phone}" class="w-full bg-white border border-gray-100 rounded-full py-4 pl-12 pr-4 text-[15px] text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/5 shadow-lg shadow-gray-100 transition-all" placeholder="Número de teléfono" required="" type="tel">
</div>
<p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-red-500 text-xs px-4"></p>

<!-- Password -->
<div class="relative group mt-4">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#94A3B8] text-[20px]">lock</span>
</div>
<input th:field="*{password}" class="w-full bg-white border border-gray-100 rounded-full py-4 pl-12 pr-4 text-[15px] text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/5 shadow-lg shadow-gray-100 transition-all" placeholder="Contraseña" required="" type="password">
</div>
<p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs px-4"></p>

<!-- Register Button -->
<div class="pt-8">
<button class="w-full bg-[#C00037] text-white font-bold text-[14px] uppercase tracking-wider rounded-full py-4 px-4 shadow-xl shadow-red-100 hover:scale-[1.02] active:scale-[0.98] transition-all" type="submit">REGISTRARSE</button>
</div>
<!-- Footer Link -->
<div class="pt-10 text-center">
<p class="text-[13px] text-gray-500 font-medium">¿Ya eres miembro? <a class="text-[#C00037] font-bold hover:underline ml-1" th:href="@{/login}">Inicia sesión</a></p>
</div>
</form>
</main>




</body></html>
