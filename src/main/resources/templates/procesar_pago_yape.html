<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" class="light" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Procesar Pago - Montenero</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#0d1c2f",
                      "on-surface": "#0d1c2f",
                      "surface-container-high": "#dde9ff",
                      "secondary": "#ba0035",
                      "outline-variant": "#c6c6cd",
                      "primary-fixed": "#dae2fd",
                      "on-tertiary": "#ffffff",
                      "surface-dim": "#ccdbf4",
                      "on-error": "#ffffff",
                      "inverse-surface": "#233144",
                      "secondary-fixed-dim": "#ffb3b6",
                      "background": "#f8f9ff",
                      "tertiary-fixed": "#d8e2ff",
                      "surface-tint": "#565e74",
                      "inverse-primary": "#bec6e0",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed": "#131b2e",
                      "surface-container": "#e6eeff",
                      "on-tertiary-container": "#3980f4",
                      "secondary-fixed": "#ffdada",
                      "tertiary-container": "#001a42",
                      "primary-container": "#131b2e",
                      "on-error-container": "#93000a",
                      "tertiary": "#000000",
                      "surface-container-low": "#eff4ff",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-fixed": "#001a42",
                      "on-primary": "#ffffff",
                      "outline": "#76777d",
                      "on-secondary-fixed": "#40000c",
                      "inverse-on-surface": "#ebf1ff",
                      "surface-bright": "#f8f9ff",
                      "surface": "#f8f9ff",
                      "primary-fixed-dim": "#bec6e0",
                      "tertiary-fixed-dim": "#adc6ff",
                      "on-primary-fixed-variant": "#3f465c",
                      "error": "#ba1a1a",
                      "primary": "#000000",
                      "on-tertiary-fixed-variant": "#004395",
                      "on-secondary-fixed-variant": "#920028",
                      "on-secondary-container": "#fffbff",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#d5e3fd",
                      "on-surface-variant": "#45464d",
                      "on-primary-container": "#7c839b",
                      "surface-variant": "#d5e3fd",
                      "secondary-container": "#e21e49",
                      "montenero-blue": "#004395"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-page": "20px",
                      "unit": "4px",
                      "stack-md": "16px",
                      "stack-sm": "8px",
                      "stack-lg": "24px",
                      "section-gap": "40px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "body-lg": [
                              "Inter"
                      ],
                      "label-md": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Inter"
                      ],
                      "label-caps": [
                              "Inter"
                      ],
                      "headline-xl": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "500"
                              }
                      ],
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-xl": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ]
              }
      },
          },
        }
    </script>
<style>
        /* Fallback for form plugins if not loaded properly via CDN */
        input[type="text"], input[type="number"], input[type="tel"] {
            border: 1px solid #c6c6cd;
            background-color: #ffffff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style data-stitch-cursor="">*{cursor:crosshair!important}[contenteditable="true"]:focus,.cursor-text:focus{cursor:text!important}</style></head>
<body class="bg-surface-container-lowest text-on-background font-body-md antialiased md:bg-surface-container-low md:flex md:justify-center md:items-start md:pt-10 md:min-h-screen">
<!-- Mobile Container Wrapper for Web View -->
<div class="w-full md:max-w-md md:bg-surface-container-lowest md:shadow-lg md:rounded-[24px] md:overflow-hidden md:border md:border-outline-variant relative min-h-screen md:min-h-0 pb-32">
<!-- TopAppBar (Transactional - No Navigation Shell below) -->
<header class="bg-surface-container-lowest docked full-width top-0 flat no shadows flex justify-between items-center w-full px-margin-page h-16 sticky z-50">
<button class="text-on-surface p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface flex-1 text-center">Procesar Pago</h1>
<div class="w-10"></div> <!-- Spacer for alignment -->
</header>
<main class="px-margin-page py-stack-md space-y-stack-lg">
<!-- Order Summary Section -->
<section class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_2px_8px_rgba(13,28,47,0.08)] border border-outline-variant/30 relative overflow-hidden">
<div class="absolute top-0 left-0 w-[4px] h-full bg-primary"></div>
<div class="flex justify-between items-center mb-stack-sm pl-2">
<span class="font-body-md text-body-md text-on-surface-variant">Total a pagar</span>
<span class="font-headline-lg text-headline-lg text-on-surface font-bold" th:text="'S/. ' + ${reserva.precioTotal}">S/. 6.00</span>
</div>
<div class="flex items-center gap-2 pl-2 mt-stack-sm pt-stack-sm border-t border-outline-variant/20">
<span class="material-symbols-outlined text-outline text-[18px]">directions_bus</span>
<span class="font-body-md text-body-md text-on-surface-variant" th:text="${reserva.viaje.origen} + ' - ' + ${reserva.viaje.destino} + ' • ' + ${#lists.size(reserva.listaNumerosAsientos)} + ' Pasajero(s)'">Piura- Paita • 1 Pasajeros</span>
</div>
</section>
<h2 class="font-body-lg text-montenero-blue mb-4">
    Seleccione la forma de pago
</h2>

<style>
.payment-btn{
    flex:1;
    min-width:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    border-radius:12px;
    border:1px solid #d6dce8;
    background:#fff;
    color:#004395;
    font-weight:600;
    transition:.25s;
}

.payment-btn:hover{
    border-color:#004395;
}

.payment-active{
    background:#004395;
    color:#fff;
    border-color:#004395;
}

.payment-btn .material-symbols-outlined{
    font-size:20px;
}

.payment-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:24px;
}
</style>

<div class="payment-grid">

    <button type="button"
            class="payment-btn"
            onclick="window.location.href='/pagos/tarjeta/'">

        <span class="material-symbols-outlined">
            credit_card
        </span>

        Tarjeta

    </button>


    <button type="button"
            class="payment-btn payment-active">

        <span class="material-symbols-outlined">
            smartphone
        </span>

        Yape

    </button>


    <button type="button"
            class="payment-btn"
            onclick="window.location.href='/pagos/efectivo/'">

        <span class="material-symbols-outlined">
            payments
        </span>

        PagoEfectivo

    </button>


    <button type="button"
            class="payment-btn"
            onclick="window.location.href='/pagos/qr/'">

        <span class="material-symbols-outlined">
            qr_code_2
        </span>

        Pago con QR

    </button>

</div>
<!-- Yape Form -->
<form th:action="@{/pagos/yape/procesar/{id}(id=${reserva.id})}" th:object="${pagoYapeDTO}" method="POST">
<section class="space-y-stack-lg">
<p class="text-montenero-blue font-body-md text-center max-w-[280px] mx-auto leading-relaxed">
    Ingresa a tu aplicativo de <span class="font-bold">YAPE</span> y copia el <span class="font-bold">código de aprobación</span> para finalizar tu compra.
</p>
<div th:if="${error}" class="bg-red-100 text-red-600 p-3 rounded-lg text-center font-bold mb-4" th:text="${error}"></div>
<div class="flex items-center justify-center gap-4 mb-stack-lg">
<div class="w-6 h-6 rounded-full border-[3px] border-[#00C29A] flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-[#00C29A]"></div>
</div>
<div class="w-16 h-16 bg-[#740081] rounded-2xl flex items-center justify-center shadow-md">
<span class="text-white font-bold text-xl italic tracking-tighter">yape</span>
</div>
</div>
<div class="space-y-stack-md">
<div class="space-y-unit">
<label class="font-body-md text-on-surface block" for="numeroTelefono">Teléfono</label>
<div class="flex gap-2">
<div class="w-20">
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-3 py-3 font-body-lg text-on-surface focus:outline-none focus:border-montenero-blue text-center" disabled="" type="text" value="+51">
</div>
<div class="flex-1">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-on-surface focus:outline-none focus:border-montenero-blue" id="numeroTelefono" th:field="*{numeroTelefono}" placeholder="Teléfono" type="tel">
</div>
</div>
<p th:if="${#fields.hasErrors('numeroTelefono')}" th:errors="*{numeroTelefono}" class="text-red-500 text-sm mt-1"></p>
</div>
<div class="space-y-unit">
<label class="font-body-md text-on-surface block" for="codigoAprobacion">Código de Aprobación</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-on-surface focus:outline-none focus:border-montenero-blue" id="codigoAprobacion" th:field="*{codigoAprobacion}" placeholder="Código de Aprobación" type="text">
<p th:if="${#fields.hasErrors('codigoAprobacion')}" th:errors="*{codigoAprobacion}" class="text-red-500 text-sm mt-1"></p>
</div>
</div>
</section>
<!-- Security Indicator -->
<div class="flex items-center justify-center gap-2 mt-stack-lg pt-stack-lg text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: &quot;FILL&quot; 1;">lock</span>
<span class="font-label-md text-label-md">Pago Seguro y Encriptado</span>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed md:absolute bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/30 p-margin-page pb-8 z-50">
<button type="submit" class="w-full bg-secondary text-on-secondary font-headline-md text-headline-md py-4 px-6 rounded-xl flex items-center justify-center gap-2 hover:bg-secondary-container transition-colors shadow-sm active:scale-[0.98]">
<span class="">Pagar Ahora</span>
<span class="font-bold border-l border-on-secondary/30 pl-2 ml-2" th:text="'S/. ' + ${reserva.precioTotal}">S/. 138.00</span>
</button>
</div>
</form>
</div>
</body></html>
