<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloPagina}">Alertas del Sistema</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-4xl mx-auto py-8 px-4">
        
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-3xl font-bold text-gray-800" th:text="${tituloPagina}">Alertas</h1>
            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Módulo Alertas</span>
        </div>

        <div class="mb-6">
            <a th:href="@{/alertas/nuevo}" 
               class="inline-flex items-center bg-[#c70039] hover:bg-[#a80038] text-white font-bold py-2.5 px-5 rounded-full shadow-md transition duration-300 transform hover:scale-105">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
                Nueva Alerta
            </a>
        </div>

        <div th:if="${#lists.isEmpty(alertas)}" class="bg-white p-6 rounded-lg shadow text-center text-gray-500">
            No hay alertas registradas en el sistema actualmente.
        </div>

        <div th:each="alerta : ${alertas}" class="bg-white p-5 rounded-lg shadow-md border-l-4 border-blue-500 mb-4">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-lg font-semibold text-gray-900" th:text="${alerta.titulo}">⚠️ Título</h3>
                    <p class="text-gray-600 mt-1 text-sm" th:text="${alerta.mensaje}">Descripción de la alerta...</p>
                </div>
                <span class="text-xs text-gray-400" th:text="${#temporals.format(alerta.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Fecha</span>
            </div>
        </div>
    </div>

</body>
</html>
