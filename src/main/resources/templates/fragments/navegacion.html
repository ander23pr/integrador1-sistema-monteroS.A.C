<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="bottom-nav(activeTab)">
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-2 bg-surface-container-lowest border-t border-outline-variant shadow-lg md:hidden">
<a th:href="@{/inicio}"
   th:classappend="${activeTab == 'inicio'} ? ' text-secondary font-bold' : ' text-on-surface-variant'"
   class="flex flex-col items-center justify-center hover:bg-surface-variant/10 rounded-lg p-2 transition-all w-16">
<span class="material-symbols-outlined" th:style="${activeTab == 'inicio'} ? 'font-variation-settings: \'FILL\' 1;' : ''">home</span>
<span class="font-label-md text-label-md mt-1">Inicio</span>
</a>
<a th:href="@{/viajes}"
   th:classappend="${activeTab == 'buscar'} ? ' text-secondary font-bold' : ' text-on-surface-variant'"
   class="flex flex-col items-center justify-center hover:bg-surface-variant/10 rounded-lg p-2 transition-all w-16">
<span class="material-symbols-outlined" th:style="${activeTab == 'buscar'} ? 'font-variation-settings: \'FILL\' 1;' : ''">search</span>
<span class="font-label-md text-label-md mt-1">Buscar</span>
</a>
<a th:href="@{/historial}"
   th:classappend="${activeTab == 'viajes'} ? ' text-secondary font-bold' : ' text-on-surface-variant'"
   class="flex flex-col items-center justify-center hover:bg-surface-variant/10 rounded-lg p-2 transition-all w-20">
<span class="material-symbols-outlined" th:style="${activeTab == 'viajes'} ? 'font-variation-settings: \'FILL\' 1;' : ''">directions_transit</span>
<span class="font-label-md text-label-md mt-1 whitespace-nowrap">Mis Viajes</span>
</a>
<a th:href="@{/notificaciones}"
   data-notificaciones-nav="true"
   th:classappend="${activeTab == 'alertas'} ? ' text-secondary font-bold' : ' text-on-surface-variant'"
   class="relative flex flex-col items-center justify-center hover:bg-surface-variant/10 rounded-lg p-2 transition-all w-16">
<span class="material-symbols-outlined" th:style="${activeTab == 'alertas'} ? 'font-variation-settings: \'FILL\' 1;' : ''">notifications</span>
<span id="notificaciones-badge"
      th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
      th:text="${notificacionesNoLeidas > 99 ? '99+' : notificacionesNoLeidas}"
      class="absolute top-0 right-2 min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-full bg-secondary text-on-secondary text-[10px] font-bold leading-none shadow-sm">0</span>
<span class="font-label-md text-label-md mt-1">Alertas</span>
</a>
<a th:href="@{/ajustes}"
   th:classappend="${activeTab == 'ajustes'} ? ' text-secondary font-bold' : ' text-on-surface-variant'"
   class="flex flex-col items-center justify-center hover:bg-surface-variant/10 rounded-lg p-2 transition-all w-16">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-md text-label-md mt-1">Ajustes</span>
</a>
</nav>
<script th:src="@{/js/notificaciones.js}"></script>
</th:block>

<th:block th:fragment="desktop-nav-alertas">
<a class="relative text-on-surface-variant flex flex-col items-center hover:opacity-80 transition-opacity" th:href="@{/notificaciones}" data-notificaciones-nav="true">
<span class="material-symbols-outlined">notifications</span>
<span id="notificaciones-badge-desktop"
      th:if="${notificacionesNoLeidas != null and notificacionesNoLeidas > 0}"
      th:text="${notificacionesNoLeidas > 99 ? '99+' : notificacionesNoLeidas}"
      class="absolute -top-1 right-0 min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-full bg-secondary text-on-secondary text-[10px] font-bold leading-none">0</span>
Alertas
</a>
</th:block>
</body>
</html>
