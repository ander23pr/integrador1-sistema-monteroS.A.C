<!DOCTYPE html><html lang="en" style="width: 390px; height: 1185px; overflow: hidden; position: relative;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Montenero Support</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#fffbff",
                        "on-surface-variant": "#45464d",
                        "surface-container-highest": "#d5e3fd",
                        "on-primary-container": "#7c839b",
                        "surface-variant": "#d5e3fd",
                        "secondary-container": "#e21e49",
                        "primary": "#000000",
                        "on-secondary-fixed-variant": "#920028",
                        "on-tertiary-fixed-variant": "#004395",
                        "inverse-on-surface": "#ebf1ff",
                        "on-secondary-fixed": "#40000c",
                        "outline": "#76777d",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-bright": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-primary-fixed-variant": "#3f465c",
                        "error": "#ba1a1a",
                        "tertiary": "#000000",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#eff4ff",
                        "on-tertiary-fixed": "#001a42",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "surface-tint": "#565e74",
                        "on-primary-fixed": "#131b2e",
                        "secondary-fixed": "#ffdada",
                        "surface-container": "#e6eeff",
                        "on-tertiary-container": "#3980f4",
                        "primary-container": "#131b2e",
                        "tertiary-container": "#001a42",
                        "surface-dim": "#ccdbf4",
                        "inverse-surface": "#233144",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#ffb3b6",
                        "background": "#f8f9ff",
                        "tertiary-fixed": "#d8e2ff",
                        "secondary": "#ba0035",
                        "outline-variant": "#c6c6cd",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#dae2fd",
                        "on-background": "#0d1c2f",
                        "on-surface": "#0d1c2f",
                        "surface-container-high": "#dde9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-md": "16px",
                        "margin-page": "20px",
                        "gutter": "16px",
                        "stack-lg": "24px",
                        "section-gap": "40px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-xl": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased selection:bg-surface-dim">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface flex justify-between items-center px-margin-page h-16">
<button class="text-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg text-headline-lg font-bold tracking-tight text-primary">Montenero</h1>
<button class="text-primary hover:opacity-80 transition-opacity flex items-center justify-center p-2 -mr-2 rounded-full">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-margin-page max-w-5xl mx-auto flex flex-col gap-section-gap">
<!-- Hero Section with Image -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-surface-container-highest overflow-hidden flex flex-col md:flex-row items-center !border-none !shadow-none !bg-transparent !mb-[-20px]"><div class="flex-1 p-6 flex flex-col gap-2 text-center md:text-left">
<div class="inline-flex items-center gap-2 bg-surface-container px-3 py-1 rounded-full w-fit mx-auto md:mx-0">
<span class="material-symbols-outlined text-[16px] text-tertiary-container" style="font-variation-settings: 'FILL' 1;">support_agent</span>
<span class="font-label-caps text-label-caps text-tertiary-container uppercase">Acceso Rápido</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">¿En qué podemos ayudarte hoy?</h2>
</div></section>
<!-- Quick Actions Bento Grid -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<button class="flex items-center justify-between p-6 bg-[#C00037] text-white rounded-xl shadow-lg hover:opacity-90 transition-all">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[32px]">report_problem</span>
<span class="font-headline-md">Reportar Problema</span>
</div>
<span class="material-symbols-outlined">arrow_forward_ios</span>
</button>
<button class="flex items-center justify-between p-6 bg-[#C00037] text-white rounded-xl shadow-lg hover:opacity-90 transition-all">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[32px]">chat</span>
<span class="font-headline-md">Chat en vivo</span>
</div>
<span class="material-symbols-outlined">arrow_forward_ios</span>
</button>
<button class="flex items-center gap-4 p-4 bg-surface-container-low border border-outline-variant rounded-xl text-on-surface hover:bg-surface-variant transition-all text-left">
<span class="material-symbols-outlined text-primary">help_center</span>
<div class="flex flex-col">
<span class="font-label-md font-bold">Centro de Ayuda</span>
<span class="text-xs opacity-70">Guías y tutoriales</span>
</div>
</button>
<button class="flex items-center gap-4 p-4 bg-surface-container-low border border-outline-variant rounded-xl text-on-surface hover:bg-surface-variant transition-all text-left">
<span class="material-symbols-outlined text-primary">phone</span>
<div class="flex flex-col">
<span class="font-label-md font-bold">Llamada de Soporte</span>
<span class="text-xs opacity-70">Atención inmediata</span>
</div>
</button>
</section>
<!-- FAQ Section -->
<section class="flex flex-col gap-stack-lg">
<h3 class="font-headline-lg text-headline-lg text-on-surface">Preguntas Frecuentes</h3>
<div class="flex flex-col gap-4">
<!-- FAQ Item 1 (Expanded) -->
<div class="bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden">
<button class="w-full px-6 py-5 flex justify-between items-center text-left hover:bg-surface/50 transition-colors">
<span class="font-body-lg text-body-lg font-medium text-on-surface">¿Cómo puedo cancelar o modificar mi reserva?</span>
<span class="material-symbols-outlined text-outline transition-transform">expand_more</span>
</button>
</div>
<!-- FAQ Item 2 -->
<div class="bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden">
<button class="w-full px-6 py-5 flex justify-between items-center text-left hover:bg-surface/50 transition-colors">
<span class="font-body-lg text-body-lg font-medium text-on-surface">¿Qué hago si mi equipaje no llega?</span>
<span class="material-symbols-outlined text-outline transition-transform">expand_more</span>
</button>
</div>
<!-- FAQ Item 3 -->
<div class="bg-surface-container-lowest rounded-xl border border-surface-container-highest shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden">
<button class="w-full px-6 py-5 flex justify-between items-center text-left hover:bg-surface/50 transition-colors">
<span class="font-body-lg text-body-lg font-medium text-on-surface">Reembolsos y compensaciones por retraso</span>
<span class="material-symbols-outlined text-outline transition-transform">expand_more</span>
</button>
</div>
</div>
<button class="self-center mt-2 px-6 py-3 border border-tertiary-container text-tertiary-container rounded-lg font-label-md text-label-md hover:bg-surface-container transition-colors shadow-sm">
                Ver todas las preguntas
            </button>
</section>
</main>
<!-- BottomNavBar -->



<div id="snapdom-sandbox" data-snapdom-sandbox="true" aria-hidden="true" style="position: absolute; left: -9999px; top: -9999px; width: 0px; height: 0px; overflow: hidden;"></div>

</body></html>
