<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" class="light" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Procesar Pago - Montenero</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "on-background": "#0d1c2f",
                "on-surface": "#0d1c2f",
                "surface-container-high": "#dde9ff",
                "secondary": "#ba0035",
                "outline-variant": "#c6c6cd",
                "primary-fixed": "#dae2fd",
                "on-tertiary": "#ffffff",
                "surface-dim": "#ccdbf4",
                "on-error": "#ffffff",
                "inverse-surface": "#233144",
                "secondary-fixed-dim": "#ffb3b6",
                "background": "#f8f9ff",
                "tertiary-fixed": "#d8e2ff",
                "surface-tint": "#565e74",
                "inverse-primary": "#bec6e0",
                "on-secondary": "#ffffff",
                "on-primary-fixed": "#131b2e",
                "surface-container": "#e6eeff",
                "on-tertiary-container": "#3980f4",
                "secondary-fixed": "#ffdada",
                "tertiary-container": "#001a42",
                "primary-container": "#131b2e",
                "on-error-container": "#93000a",
                "tertiary": "#000000",
                "surface-container-low": "#eff4ff",
                "surface-container-lowest": "#ffffff",
                "on-tertiary-fixed": "#001a42",
                "on-primary": "#ffffff",
                "outline": "#76777d",
                "on-secondary-fixed": "#40000c",
                "inverse-on-surface": "#ebf1ff",
                "surface-bright": "#f8f9ff",
                "surface": "#f8f9ff",
                "primary-fixed-dim": "#bec6e0",
                "tertiary-fixed-dim": "#adc6ff",
                "on-primary-fixed-variant": "#3f465c",
                "error": "#ba1a1a",
                "primary": "#000000",
                "on-tertiary-fixed-variant": "#004395",
                "on-secondary-fixed-variant": "#920028",
                "on-secondary-container": "#fffbff",
                "error-container": "#ffdad6",
                "surface-container-highest": "#d5e3fd",
                "on-surface-variant": "#45464d",
                "on-primary-container": "#7c839b",
                "surface-variant": "#d5e3fd",
                "secondary-container": "#e21e49",
                "montenero-blue": "#004395"
              },
              "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
              },
              "spacing": {
                "margin-page": "20px",
                "unit": "4px",
                "stack-md": "16px",
                "stack-sm": "8px",
                "stack-lg": "24px",
                "section-gap": "40px",
                "gutter": "16px"
              },
              "fontFamily": {
                "body-lg": ["Inter"],
                "label-md": ["Inter"],
                "body-md": ["Inter"],
                "headline-md": ["Inter"],
                "headline-lg": ["Inter"],
                "label-caps": ["Inter"],
                "headline-xl": ["Inter"]
              },
              "fontSize": {
                "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .payment-btn {
            flex: 1;
            min-width: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #d6dce8;
            background: #fff;
            color: #004395;
            font-weight: 600;
            transition: .25s;
            cursor: pointer;
        }
        .payment-btn:hover {
            border-color: #004395;
        }
        .payment-active {
            background: #004395;
            color: #fff;
            border-color: #004395;
        }
        .payment-btn .material-symbols-outlined {
            font-size: 20px;
        }
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .form-input-line {
            border: none;
            border-bottom: 1.5px solid #E2E8F0;
            padding: 8px 0;
            border-radius: 0;
            background: transparent;
            width: 100%;
            transition: border-color 0.2s;
        }
        .form-input-line:focus {
            border-bottom-color: #004395;
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-background font-body-md antialiased md:bg-surface-container-low md:flex md:justify-center md:items-start md:pt-10 md:min-h-screen">

<div class="w-full md:max-w-md md:bg-surface-container-lowest md:shadow-lg md:rounded-[24px] md:overflow-hidden md:border md:border-outline-variant relative min-h-screen md:min-h-0 pb-40">

<header class="bg-primary-container text-white shadow-md border-b border-secondary/30 flex justify-between items-center w-full px-margin-page h-16 sticky top-0 z-50 rounded-b-2xl">
    <a th:href="@{/reservas/resumen}" class="text-white hover:bg-white/10 transition-colors p-2 -ml-2 rounded-full flex items-center justify-center">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1 class="font-headline-md text-headline-md text-white flex-1 text-center">Procesar Pago</h1>
    <div class="w-10"></div>
</header>

<main class="px-margin-page py-stack-md space-y-stack-lg">

    <!-- Total a pagar -->
    <section class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_2px_8px_rgba(13,28,47,0.08)] border border-outline-variant/30 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-[4px] h-full bg-primary"></div>
        <div class="flex justify-between items-center mb-stack-sm pl-2">
            <span class="font-body-md text-body-md text-on-surface-variant">Total a pagar</span>
            <span class="font-headline-lg text-headline-lg text-on-surface font-bold" th:text="'S/. ' + ${reserva.precioTotal}">S/. 6.00</span>
        </div>
        <div class="flex items-center gap-2 pl-2 mt-stack-sm pt-stack-sm border-t border-outline-variant/20">
            <span class="material-symbols-outlined text-outline text-[18px]">directions_bus</span>
            <span class="font-body-md text-body-md text-on-surface-variant" th:text="${reserva.viaje.origen} + ' - ' + ${reserva.viaje.destino} + ' • ' + ${#lists.size(reserva.listaNumerosAsientos)} + ' Pasajero(s)'">Piura - Paita • 1 Pasajero(s)</span>
        </div>
    </section>

    <!-- Selector de métodos de pago -->
    <h2 class="font-body-lg text-montenero-blue font-semibold mb-4">Seleccione la forma de pago</h2>

    <div class="payment-grid">
        <a th:href="@{/pagos/tarjeta/{id}(id=${reserva.id})}" class="payment-btn payment-active">
            <span class="material-symbols-outlined">credit_card</span>
            Tarjeta
        </a>
        <a th:href="@{/pagos/yape/{id}(id=${reserva.id})}" class="payment-btn">
            <span class="material-symbols-outlined">smartphone</span>
            Yape
        </a>
        <a th:href="@{/pagos/pagoefectivo/{id}(id=${reserva.id})}" class="payment-btn">
            <span class="material-symbols-outlined">payments</span>
            PagoEfectivo
        </a>
        <a th:href="@{/pagos/qr/{id}(id=${reserva.id})}" class="payment-btn">
            <span class="material-symbols-outlined">qr_code_2</span>
            Pago con QR
        </a>
    </div>

    <!-- Contenido específico: Tarjeta -->
    <form th:action="@{/pagos/tarjeta/procesar/{id}(id=${reserva.id})}" method="POST">
        <section class="space-y-stack-lg">
            <div th:if="${error}" class="bg-red-100 text-red-600 p-3 rounded-lg text-center font-bold mb-4" th:text="${error}"></div>

            <div class="flex items-center gap-5 mb-6 justify-center opacity-90">
                <img alt="Visa" class="h-6" th:src="@{/images/visa_logo.png}">
                <img alt="Mastercard" class="h-8" th:src="@{/images/mastercard_logo.png}">
                <img alt="Amex" class="h-7" th:src="@{/images/express_logo.png}">
            </div>

            <div class="space-y-stack-md">
                <div class="space-y-unit">
                    <label class="font-body-md text-on-surface block" for="numeroTarjeta">Número de Tarjeta</label>
                    <input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-on-surface focus:outline-none focus:border-montenero-blue" id="numeroTarjeta" name="numeroTarjeta" placeholder="0000 0000 0000 0000" type="text" maxlength="19" required>
                </div>
                <div class="flex gap-stack-md">
                    <div class="flex-1 space-y-unit">
                        <label class="font-body-md text-on-surface block" for="fechaExpiracion">Expira (MM/AA)</label>
                        <input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-on-surface focus:outline-none focus:border-montenero-blue" id="fechaExpiracion" name="fechaExpiracion" placeholder="MM / AA" type="text" maxlength="7" required>
                    </div>
                    <div class="flex-1 space-y-unit">
                        <label class="font-body-md text-on-surface block" for="cvv">CVV</label>
                        <input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-on-surface focus:outline-none focus:border-montenero-blue" id="cvv" name="cvv" placeholder="123" type="password" maxlength="4" required>
                    </div>
                </div>
                <div class="space-y-unit">
                    <label class="font-body-md text-on-surface block" for="nombreTitular">Nombre del Titular</label>
                    <input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-on-surface focus:outline-none focus:border-montenero-blue" id="nombreTitular" name="nombreTitular" placeholder="Como figura en la tarjeta" type="text" required>
                </div>
            </div>
        </section>

        <!-- Botones inferiores -->
        <div class="fixed md:absolute bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/30 px-margin-page py-stack-md z-50 flex gap-3">
            <button type="button" onclick="MonteneroNotificaciones.mostrarModalConfirmacion({ titulo: 'Aviso', mensaje: 'Estimado usuario, al cancelar se eliminarán los asientos separados.\u00bfSeguro desea cancelar?', textoSi: 'SI', textoNo: 'NO', onConfirm: function() { window.location.href = '/reservas/' + reservaId + '/cancelar'; } })" class="flex-1 bg-white border-2 border-outline-variant text-on-surface font-headline-md text-headline-md py-4 px-6 rounded-xl flex items-center justify-center gap-2 hover:bg-surface-container transition-colors active:scale-[0.98]">
                Cancelar
            </button>
            <button type="submit" class="flex-1 bg-secondary text-on-secondary font-headline-md text-headline-md py-4 px-6 rounded-xl flex items-center justify-center gap-2 hover:bg-secondary-container transition-colors shadow-sm active:scale-[0.98]">
                <span>Pagar Ahora</span>
            </button>
        </div>
    </form>

</main>
</div>

<script th:src="@{/js/notificaciones.js}"></script>
<script th:inline="javascript">
var reservaId = /*[[${reserva.id}]]*/ null;
document.addEventListener('DOMContentLoaded', function () {
  if (window.MonteneroTemporizador) {
    MonteneroTemporizador.iniciar(reservaId);
  }
});
</script>
</body>
</html>
