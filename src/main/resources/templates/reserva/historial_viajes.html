<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-primary-container text-white shadow-md border-b border-secondary/30 docked full-width top-0 flex justify-between items-center w-full px-margin-page h-16 sticky z-40 rounded-b-2xl">
<a th:href="@{/viajes}" aria-label="Back" class="text-white hover:bg-white/10 transition-colors flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-headline-lg text-headline-lg font-bold tracking-tight text-white"></h1>
<a th:href="@{/perfil(origen='/reservas/historial')}"
   aria-label="Profile"
   class="text-white hover:bg-white/10 transition-colors flex items-center justify-center p-2 rounded-full">
<img th:src="${session.usuarioLogueado != null && session.usuarioLogueado.fotoPerfil != null ? session.usuarioLogueado.fotoPerfil : 'https://lh3.googleusercontent.com/aida-public/AB6AXuAqCRchW_OGWiKv82gJ8j7hhip7Tz1eXwAq5ygCPqbryYNIYzvCSgl3VaUq76r7ELczeibqdm9yHFwAlBaQnI-q_G-J1E6CIul5UaOrNYJ-gASfCqWn_AaEoyj-20h6_hHzplKxGr5roo4wKHkj0xMwJhH9kBPGI9l23L0wGq2SEanlVV5ZNEHATuGufLtbrfyI1JGpXBbDjubjYOugtSaawxU3_YIFfcD-O6dvrGvEyfxR9WInqpN1AwKQrr86M-806goYLdWwPkDk'}" alt="User Profile" class="w-10 h-10 rounded-full object-cover border border-white/30 hover:scale-105 transition-transform">
</a>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-page py-stack-lg pb-32">
<!-- Header & Search Section -->
<section class="mb-section-gap">
<h2 class="font-headline-xl text-headline-xl mb-stack-md text-primary">Historial de viajes</h2>
<form th:action="@{/reservas/historial}" method="get" class="flex flex-col md:flex-row gap-gutter">
<div class="relative flex-grow">
<span class="material-symbols-outlined absolute left-3 top-1/2 transform -translate-y-1/2 text-outline">search</span>
<input name="busqueda" th:value="${busqueda}" class="w-full pl-10 pr-4 py-3 bg-[#F1F5F9] border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" placeholder="Buscar destinos, fechas..." type="text">
<input type="hidden" name="filtro" th:value="${filtro}" />
<input type="hidden" name="orden" th:value="${orden}" />
</div>
<div class="flex gap-unit">
<button type="submit" class="px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-label-md text-on-surface-variant flex items-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="filter_list">filter_list</span>
                        Buscar
                    </button>
<a th:href="@{/reservas/historial(busqueda=${busqueda}, filtro=${filtro}, orden=${orden == 'fecha_desc' ? 'fecha_asc' : 'fecha_desc'})}" class="px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-label-md text-on-surface-variant flex items-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="sort">sort</span>
                        <span th:text="${orden == 'fecha_desc' ? 'Más antiguas' : 'Más recientes'}">Ordenar</span>
                    </a>
</div>
</form>
<!-- Quick Filters (Chips) -->
<div class="flex overflow-x-auto gap-unit mt-stack-md pb-2 no-scrollbar">
<a th:href="@{/reservas/historial(busqueda=${busqueda}, filtro='todos', orden=${orden})}" th:classappend="${filtro == null || #strings.equalsIgnoreCase(filtro, 'todos') ? 'bg-secondary text-on-secondary shadow-sm' : 'bg-surface-highest text-primary border border-outline-variant'}" class="whitespace-nowrap px-4 py-1.5 rounded-full font-label-md hover:bg-surface-variant transition-colors">Todos los viajes</a>
<a th:href="@{/reservas/historial(busqueda=${busqueda}, filtro='completados', orden=${orden})}" th:classappend="${#strings.equalsIgnoreCase(filtro, 'completados') ? 'bg-secondary text-on-secondary shadow-sm' : 'bg-surface-highest text-primary border border-outline-variant'}" class="whitespace-nowrap px-4 py-1.5 rounded-full font-label-md hover:bg-surface-variant transition-colors">Completados</a>
<a th:href="@{/reservas/historial(busqueda=${busqueda}, filtro='cancelados', orden=${orden})}" th:classappend="${#strings.equalsIgnoreCase(filtro, 'cancelados') ? 'bg-secondary text-on-secondary shadow-sm' : 'bg-surface-highest text-primary border border-outline-variant'}" class="whitespace-nowrap px-4 py-1.5 rounded-full font-label-md hover:bg-surface-variant transition-colors">Cancelados</a>
</div>
</section>
<!-- Trip Cards List -->
<section id="lista-viajes" class="flex flex-col gap-stack-lg">
<div th:if="${#lists.isEmpty(reservas)}" class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/30 p-stack-lg text-center text-on-surface-variant">
No tienes viajes registrados con esos criterios.
</div>
<div th:unless="${#lists.isEmpty(reservas)}" th:replace="~{reserva/fragments/historial_tarjetas :: tarjetas}"></div>
</section>
<!-- Image inclusion as requested -->

</div>
</main>
<!-- BottomNavBar -->
<nav th:replace="~{fragments/navegacion :: bottom-nav('viajes')}"></nav>

<script>
function cargarMasViajes(boton) {
    var page = boton.getAttribute('data-next-page');
    var busqueda = boton.getAttribute('data-busqueda') || '';
    var filtro = boton.getAttribute('data-filtro') || 'todos';
    var orden = boton.getAttribute('data-orden') || 'fecha_desc';

    boton.disabled = true;
    boton.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span> Cargando...';

    var url = '/reservas/historial/tarjetas?page=' + page
            + '&busqueda=' + encodeURIComponent(busqueda)
            + '&filtro=' + encodeURIComponent(filtro)
            + '&orden=' + encodeURIComponent(orden);

    fetch(url)
        .then(function(r) { return r.text(); })
        .then(function(html) {
            var btnContainer = document.getElementById('cargar-mas-container');
            var lista = document.getElementById('lista-viajes');
            if (btnContainer) btnContainer.remove();
            lista.insertAdjacentHTML('beforeend', html);
        })
        .catch(function() {
            boton.disabled = false;
            boton.innerHTML = '<span class="material-symbols-outlined text-lg">expand_more</span> Cargar más viajes';
            alert('Error al cargar más viajes. Intenta nuevamente.');
        });
}
</script>
</body></html>
