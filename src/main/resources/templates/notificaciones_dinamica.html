<body class="bg-background text-on-background font-body-md min-h-screen pb-24 md:pb-0">

<img th:src="${session.usuarioLogueado != null && session.usuarioLogueado.fotoPerfil != null ? session.usuarioLogueado.fotoPerfil : 'https://lh3.googleusercontent.com/aida-public/AB6AXuDMkhznKqR-45QfFRY9Snyzbd0MRJvYREZbLBbZOQzGeFj3DtENCmVlUv_dCSslUGyVv9hgwJ8DIf61JmhY1QRC7XQ0uY8d0hjCqjRQ-ts-b8YHPz7DzaTgYqyPEN2wctGm51C3gy9bbRTCa-rRhkfMBoPY84P9nlP9SOn4vPmug1d8c_KEjlZvLTjDmNICIt65x7A0ReE3NIcZl2hvfb4gaRPH5PzZLegHRCPF1yfazeSdx5Tn_gIh95xiTgRPQRENx2bJOChJs9f9'}" alt="User Profile" class="w-full h-full object-cover">
</a>

</header>
<main class="px-margin-page py-stack-lg max-w-3xl mx-auto">
<div class="flex justify-between items-end mb-stack-md">
<h2 class="font-headline-md text-headline-md text-primary">Notificaciones</h2>
<form th:action="@{/notificaciones/marcar-todo-leido}" method="post">
<button type="submit" class="font-label-md text-label-md text-secondary hover:opacity-80 transition-opacity">Marcar todo como leído</button>
</form>
</div>
<div class="flex flex-col gap-stack-md" th:if="${notificacionesAgrupadas != null and !#maps.isEmpty(notificacionesAgrupadas)}" data-notificaciones-contenedor>
<div th:each="grupo : ${notificacionesAgrupadas}" class="flex flex-col gap-unit" data-notificaciones-grupo>
<h3 class="font-label-caps text-label-caps text-outline uppercase tracking-widest pl-2" th:text="${grupo.key}">Hoy</h3>
<div th:each="notificacion : ${grupo.value}"
     class="relative overflow-hidden rounded-lg"
     data-notificacion-swipe
     th:attr="data-id=${notificacion.id}">
<!-- Fondo de eliminación: se revela por debajo al deslizar la tarjeta hacia la izquierda -->
<div class="absolute inset-0 bg-error rounded-lg flex items-center justify-end pr-6">
<button type="button" class="notificacion-btn-eliminar text-on-error flex flex-col items-center gap-0.5" aria-label="Eliminar notificación">
<span class="material-symbols-outlined">delete</span>
<span class="font-label-md text-label-md">Eliminar</span>
</button>
</div>
<!-- Tarjeta visible: se desliza sobre el fondo rojo -->
<div class="notificacion-card relative z-10 bg-surface-container-lowest rounded-lg p-stack-md shadow-sm border border-surface-variant flex gap-gutter items-start overflow-hidden group hover:shadow-md transition-shadow"
     style="touch-action: pan-y;">
<div th:classappend="${notificacion.leida ? 'bg-outline' : 'bg-secondary'}" class="absolute left-0 top-0 bottom-0 w-1 rounded-l-lg"></div>
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-surface-container text-on-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined" th:text="${notificacion.icono}">notifications</span>
</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-1">
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold" th:text="${notificacion.titulo}">Notificación</h3>
<span class="font-label-md text-label-md text-on-surface-variant whitespace-nowrap ml-2" th:text="${#temporals.format(notificacion.fechaCreacion, 'HH:mm')}">00:00</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant" th:text="${notificacion.mensaje}">Mensaje</p>

</div>
<div th:if="${!notificacion.leida}" class="w-2 h-2 rounded-full bg-secondary flex-shrink-0 mt-2"></div>

<div th:if="${notificacionesAgrupadas == null or #maps.isEmpty(notificacionesAgrupadas)}" class="bg-surface-container-lowest rounded-lg p-stack-md shadow-sm border border-surface-variant text-center text-on-surface-variant">
No tienes notificaciones por mostrar en este momento.
</div>
</main>
<nav th:replace="~{fragments/navegacion :: bottom-nav('alertas')}"></nav>

<script>
(function () {
    // Umbrales del gesto de deslizar, en píxeles.
    var UMBRAL_REVELAR = 48;       // a partir de aquí, al soltar, la tarjeta queda "revelada"
    var UMBRAL_AUTO_ELIMINAR = 140; // a partir de aquí, al soltar, se elimina directamente
    var POSICION_REVELADA = -96;    // dónde queda la tarjeta al mostrarse el botón eliminar
    var ARRASTRE_MAXIMO = -160;     // tope para no sobre-deslizar
    var TOLERANCIA_TOQUE = 6;       // movimiento mínimo para distinguir un "tap" de un arrastre

    var wrapperRevelado = null;

    function cerrarRevelado() {
        if (!wrapperRevelado) return;
        var tarjeta = wrapperRevelado.querySelector('.notificacion-card');
        tarjeta.style.transition = 'transform 0.2s ease';
        tarjeta.style.transform = 'translateX(0px)';
        wrapperRevelado = null;
    }

    function eliminarNotificacion(wrapper) {
        var id = wrapper.getAttribute('data-id');
        var tarjeta = wrapper.querySelector('.notificacion-card');

        if (wrapperRevelado === wrapper) {
            wrapperRevelado = null;
        }

        // 1) La tarjeta termina de salir por la izquierda.
        tarjeta.style.transition = 'transform 0.22s ease';
        tarjeta.style.transform = 'translateX(-110%)';

        // 2) El espacio que ocupaba se colapsa suavemente.
        window.setTimeout(function () {
            wrapper.style.overflow = 'hidden';
            wrapper.style.maxHeight = wrapper.offsetHeight + 'px';
            wrapper.style.transition = 'max-height 0.22s ease, opacity 0.22s ease, margin 0.22s ease';
            void wrapper.offsetHeight; // fuerza reflow para que la transición sí anime
            wrapper.style.maxHeight = '0px';
            wrapper.style.opacity = '0';
            wrapper.style.marginBottom = '0px';
        }, 180);

        // 3) Se quita del DOM ya terminada la animación.
        window.setTimeout(function () {
            wrapper.remove();

            var grupo = wrapper.closest('[data-notificaciones-grupo]');
            if (grupo) {
                var cardsRestantes = grupo.querySelectorAll('[data-notificacion-swipe]');
                if (cardsRestantes.length === 0) {
                    grupo.remove();
                }
            }

            var contenedor = document.querySelector('[data-notificaciones-contenedor]');
            if (contenedor) {
                var gruposRestantes = contenedor.querySelectorAll('[data-notificaciones-grupo]');
                if (gruposRestantes.length === 0) {
                    contenedor.remove();
                    var emptyMsg = document.querySelector('[data-notificaciones-vacio]');
                    if (emptyMsg) {
                        emptyMsg.style.display = 'block';
                    } else {
                        var main = document.querySelector('main');
                        var nuevoEmpty = document.createElement('div');
                        nuevoEmpty.setAttribute('data-notificaciones-vacio', '');
                        nuevoEmpty.className = 'bg-surface-container-lowest rounded-lg p-stack-md shadow-sm border border-surface-variant text-center text-on-surface-variant';
                        nuevoEmpty.textContent = 'No tienes notificaciones por mostrar en este momento.';
                        main.appendChild(nuevoEmpty);
                    }
                }
            }
        }, 420);

        fetch('/notificaciones/' + id + '/eliminar', { method: 'POST' }).catch(function () {
            // Si la petición falla, la tarjeta ya se quitó visualmente; no se
            // reintenta para no complicar la experiencia en un proyecto académico.
        });
    }

    document.querySelectorAll('[data-notificacion-swipe]').forEach(function (wrapper) {
        var tarjeta = wrapper.querySelector('.notificacion-card');
        var botonEliminar = wrapper.querySelector('.notificacion-btn-eliminar');

        var arrastrando = false;
        var xInicio = 0;
        var yInicio = 0;
        var xBase = 0;
        var esHorizontal = null;

        tarjeta.addEventListener('pointerdown', function (evento) {
            if (evento.button !== undefined && evento.button !== 0) return;
            arrastrando = true;
            esHorizontal = null;
            xInicio = evento.clientX;
            yInicio = evento.clientY;
            xBase = (wrapperRevelado === wrapper) ? POSICION_REVELADA : 0;
            tarjeta.style.transition = 'none';
            try { tarjeta.setPointerCapture(evento.pointerId); } catch (error) { /* no soportado, se ignora */ }
        });

        tarjeta.addEventListener('pointermove', function (evento) {
            if (!arrastrando) return;
            var dx = evento.clientX - xInicio;
            var dy = evento.clientY - yInicio;

            if (esHorizontal === null) {
                if (Math.abs(dx) > TOLERANCIA_TOQUE || Math.abs(dy) > TOLERANCIA_TOQUE) {
                    esHorizontal = Math.abs(dx) > Math.abs(dy);
                }
            }
            if (esHorizontal === false) return; // se deja hacer scroll vertical normal
            if (esHorizontal === true) {
                evento.preventDefault();
                var nuevaX = Math.min(0, Math.max(ARRASTRE_MAXIMO, xBase + dx));
                tarjeta.style.transform = 'translateX(' + nuevaX + 'px)';
            }
        }, { passive: false });

        function finalizarArrastre(evento) {
            if (!arrastrando) return;
            arrastrando = false;
            if (esHorizontal !== true) return;

            var dx = evento.clientX - xInicio;
            var posicionFinal = Math.min(0, Math.max(ARRASTRE_MAXIMO, xBase + dx));

            tarjeta.style.transition = 'transform 0.2s ease';

            if (posicionFinal <= -UMBRAL_AUTO_ELIMINAR) {
                tarjeta.style.transform = 'translateX(' + ARRASTRE_MAXIMO + 'px)';
                eliminarNotificacion(wrapper);
                return;
            }
            if (posicionFinal <= -UMBRAL_REVELAR) {
                if (wrapperRevelado && wrapperRevelado !== wrapper) {
                    cerrarRevelado();
                }
                tarjeta.style.transform = 'translateX(' + POSICION_REVELADA + 'px)';
                wrapperRevelado = wrapper;
            } else {
                tarjeta.style.transform = 'translateX(0px)';
                if (wrapperRevelado === wrapper) {
                    wrapperRevelado = null;
                }
            }
        }

        tarjeta.addEventListener('pointerup', finalizarArrastre);
        tarjeta.addEventListener('pointercancel', finalizarArrastre);

        // Si la tarjeta está revelada y el usuario la toca (fuera del botón),
        // se cierra en vez de disparar el enlace "Ver boleto".
        tarjeta.addEventListener('click', function (evento) {
            if (wrapperRevelado === wrapper) {
                evento.preventDefault();
                evento.stopPropagation();
                cerrarRevelado();
            }
        }, true);

        if (botonEliminar) {
            botonEliminar.addEventListener('click', function (evento) {
                evento.preventDefault();
                evento.stopPropagation();
                eliminarNotificacion(wrapper);
            });
        }
    });

    // Toca fuera de cualquier notificación: cierra la que esté revelada.
    document.addEventListener('click', function (evento) {
        if (wrapperRevelado && !wrapperRevelado.contains(evento.target)) {
            cerrarRevelado();
        }
    });
})();
</script>
</body>
</html>
