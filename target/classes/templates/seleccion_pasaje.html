<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Montenero - Ticket Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary-fixed": "#001a42",
                      "error-container": "#ffdad6",
                      "on-primary-fixed-variant": "#3f465c",
                      "on-background": "#0d1c2f",
                      "tertiary-fixed-dim": "#adc6ff",
                      "surface-bright": "#f8f9ff",
                      "secondary-fixed": "#ffdada",
                      "on-secondary-fixed": "#40000c",
                      "surface-container": "#e6eeff",
                      "error": "#ba1a1a",
                      "tertiary": "#000000",
                      "secondary": "#ba0035",
                      "surface-container-lowest": "#ffffff",
                      "on-secondary-fixed-variant": "#920028",
                      "secondary-container": "#e21e49",
                      "on-secondary-container": "#fffbff",
                      "on-primary": "#ffffff",
                      "on-surface": "#0d1c2f",
                      "on-tertiary": "#ffffff",
                      "on-error-container": "#93000a",
                      "surface-container-low": "#eff4ff",
                      "inverse-surface": "#233144",
                      "on-primary-container": "#7c839b",
                      "background": "#f8f9ff",
                      "surface": "#f8f9ff",
                      "on-primary-fixed": "#131b2e",
                      "surface-container-high": "#dde9ff",
                      "surface-variant": "#d5e3fd",
                      "surface-container-highest": "#d5e3fd",
                      "on-tertiary-container": "#3980f4",
                      "inverse-on-surface": "#ebf1ff",
                      "inverse-primary": "#bec6e0",
                      "primary-fixed": "#dae2fd",
                      "primary": "#000000",
                      "on-tertiary-fixed-variant": "#004395",
                      "tertiary-fixed": "#d8e2ff",
                      "secondary-fixed-dim": "#ffb3b6",
                      "surface-dim": "#ccdbf4",
                      "surface-tint": "#565e74",
                      "on-surface-variant": "#45464d",
                      "outline-variant": "#c6c6cd",
                      "primary-fixed-dim": "#bec6e0",
                      "outline": "#76777d",
                      "on-error": "#ffffff",
                      "tertiary-container": "#001a42",
                      "primary-container": "#131b2e",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-md": "16px",
                      "unit": "4px",
                      "stack-lg": "24px",
                      "section-gap": "40px",
                      "margin-page": "20px",
                      "gutter": "16px",
                      "stack-sm": "8px"
              },
              "fontFamily": {
                      "label-md": [
                              "Inter"
                      ],
                      "headline-xl": [
                              "Inter"
                      ],
                      "label-caps": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Inter"
                      ],
                      "body-lg": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "500"
                              }
                      ],
                      "headline-xl": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ]
              }
      },
          },
        }
      </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim shadow-sm flex justify-between items-center w-full px-margin-page h-16 sticky top-0 z-50">
<button class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150">

</button>
<h1 class="font-headline-lg text-headline-lg font-bold tracking-tight text-primary dark:text-on-surface"><br></h1>
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-150 rounded-full overflow-hidden w-10 h-10 border border-outline-variant/30">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDirPqir_d2O6kvzDNLMI6g-m7_wyuI7oNYEq7wzttmDBCJg7fD5EqIQhb0wifmeNu1WI8qh67v_REerIykDWSZZNKfHaMj8OzUARJj3-bS7KZhhgUHi5mvkO8-fdM2Ig0iV2cudV2VSBRCt90mm7p6szHHKSFcGdQB010ZPBdkpV8B_yBiYwM9yUiSg40qLET8OpTGXdqKmRwaacFIvLub9HQFu4Sb3nH_tnWEv33ifZj504NWpynRSS48NzECU8-ZAxahgWzTyzCg" alt="User profile" class="w-full h-full object-cover">
</button>
</header>
<main class="px-margin-page pt-stack-lg max-w-3xl mx-auto w-full">
<!-- Search Summary -->
<div class="mb-section-gap flex items-center justify-between bg-surface-container-lowest p-stack-md rounded-xl shadow-sm border border-outline-variant/30">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase" th:text="${origenBuscado} + ' → ' + ${destinoBuscado}">piura - paita</p>
<p class="font-body-md text-body-md text-on-surface mt-unit" th:text="'Ida: ' + ${#temporals.format(fechaBuscada, 'dd MMM yyyy')} + (${fechaRetornoBuscada} != null ? ' | Retorno: ' + ${#temporals.format(fechaRetornoBuscada, 'dd MMM yyyy')} : '') + ' • 1 Pasajero'">Mar 12, 2025 • 1 Pasajero</p>
</div>
<a th:href="@{/viajes}" class="text-on-tertiary-container hover:opacity-80 transition-opacity flex items-center gap-1">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
<span class="text-sm font-medium">Editar</span>
</a>
</div>
<div class="flex items-center justify-between mb-stack-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Selecciona tu viaje</h2>
<button class="flex items-center gap-unit text-on-surface-variant hover:text-on-surface transition-colors font-label-md text-label-md">
<span class="material-symbols-outlined text-[18px]" data-icon="filter_list">filter_list</span>
                Filtros
            </button>
</div>
<!-- Ticket Cards List -->
<div class="flex flex-col gap-stack-md">

<div th:if="${#lists.isEmpty(viajes)}" class="p-4 bg-surface-container-low rounded-xl border border-outline-variant/30 text-center">
    <p class="text-on-surface-variant font-bold">No se encontraron viajes para esta ruta y fecha.</p>
    <a th:href="@{/viajes}" class="mt-4 inline-block bg-secondary text-white py-2 px-4 rounded-lg">Realizar nueva búsqueda</a>
</div>

<!-- Card iterada con Thymeleaf -->
<article th:each="viaje : ${viajes}" class="bg-surface-container-lowest rounded-xl p-stack-md shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-outline-variant/20 relative overflow-hidden flex flex-col md:flex-row gap-stack-md">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-tertiary-container"></div>

<div class="flex-1 flex flex-col justify-between">
<div class="flex items-center justify-between mb-stack-md pt-stack-sm md:pt-0">
<div class="flex items-center gap-stack-sm">
<img alt="Montero Bus" class="w-12 h-12 rounded-full object-cover border border-outline-variant/30" src="https://lh3.googleusercontent.com/aida/ADBb0ujAzRTtBB5v9PRIr0Fzsf_Yg98cMYnTjDtt2hPnbh7sjcJHikMqqZABnlPIJXhmC1CcCfNCWwXKWof0_Ybg1uzRxw7fHPD3bxGQwyuG5u_JiOpM2ZPb9C8d82jvZaULukBUkf9NeyoWOD8sv2K0T2FqgjWjFBVNNP-mu-NAzpM7Ybw2Tq2gsEpkh66jEE9CoFXNZPvgHre_T9VmJWdBzYir9RKNxojVcepqPb4q7KJHnJ1iOEnXTY0JxnaSQ5EtL5LUepaL-5nA18Q">
<div>
<p class="font-headline-md text-headline-md text-on-surface" th:text="${viaje.horaSalida}">18:00</p>
<p class="font-label-md text-label-md text-on-surface-variant" th:text="${viaje.origen}">Piura (Terminal Montero)</p>
</div>
</div>
</div>
<div class="flex items-center gap-stack-sm text-on-surface-variant font-label-md text-label-md pl-14 md:pl-0 my-stack-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="schedule">schedule</span>Directo • Asientos libres: <span th:text="${viaje.asientosTotales}"></span>
</div>
<div class="flex items-center gap-stack-sm mt-stack-sm">
<div class="w-12 h-12 flex-shrink-0"></div> <!-- Spacer for alignment -->
<div>
<p class="font-headline-md text-headline-md text-on-surface" th:text="${#temporals.format(viaje.fechaSalida, 'dd MMM yyyy')}">29 May 2026</p>
<p class="font-label-md text-label-md text-on-surface-variant" th:text="${viaje.destino}">Paita (Terminal Terrestre)</p>
</div>
</div>
</div>
<div class="md:w-1/3 flex flex-col justify-between border-t md:border-t-0 md:border-l border-outline-variant/20 pt-stack-md md:pt-0 md:pl-stack-md">
<div class="flex justify-between items-end mb-stack-md md:mb-0 md:flex-col md:items-end">
<span class="font-body-md text-body-md text-on-surface-variant">Precio</span>
<span class="font-headline-lg text-headline-lg font-bold text-secondary" th:text="'S/ ' + ${viaje.precio}">S/. 6.00</span>
</div>
<a th:href="@{/reservas/viaje/{id}/asientos(id=${viaje.id},origen=${origenBuscado},destino=${destinoBuscado},fecha=${fechaBuscada})}" class="w-full bg-secondary text-on-secondary font-label-caps text-label-caps uppercase py-3 rounded-xl hover:opacity-90 transition-opacity focus:ring-2 focus:ring-secondary focus:ring-offset-2 text-center block">
                        Seleccionar
</a>
</div>
</article>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-2 border-t border-outline-variant bg-surface-container-lowest dark:bg-surface-container-low shadow-lg md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant/10 rounded-lg p-2 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed font-bold hover:bg-surface-variant/10 rounded-lg p-2 transition-colors scale-90">
<span class="material-symbols-outlined mb-1" data-icon="search" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">search</span>
<span class="font-label-md text-label-md">Buscar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant/10 rounded-lg p-2 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="directions_transit">directions_transit</span>
<span class="font-label-md text-label-md">Mis Viajes</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant/10 rounded-lg p-2 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="notifications">notifications</span>
<span class="font-label-md text-label-md">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-variant/10 rounded-lg p-2 transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="settings" data-stitch-orig-opacity="0">settings</span>
<span class="font-label-md text-label-md">Ajustes</span>
</button>
</nav>








</body></html>
