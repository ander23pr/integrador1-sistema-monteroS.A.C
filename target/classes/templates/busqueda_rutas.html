<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Montenero - Search Routes</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "on-tertiary-fixed": "#001a42",
                "on-primary-container": "#7c839b",
                "primary-fixed-dim": "#bec6e0",
                "primary-fixed": "#dae2fd",
                "on-secondary-fixed": "#40000c",
                "surface-container-lowest": "#ffffff",
                "inverse-surface": "#233144",
                "surface": "#f8f9ff",
                "outline": "#76777d",
                "on-primary": "#ffffff",
                "outline-variant": "#c6c6cd",
                "surface-tint": "#565e74",
                "surface-dim": "#ccdbf4",
                "secondary-container": "#e21e49",
                "on-surface-variant": "#45464d",
                "surface-variant": "#d5e3fd",
                "primary": "#000000",
                "on-error": "#ffffff",
                "on-surface": "#0d1c2f",
                "secondary-fixed": "#ffdada",
                "on-tertiary-fixed-variant": "#004395",
                "inverse-primary": "#bec6e0",
                "on-secondary-fixed-variant": "#920028",
                "on-tertiary-container": "#3980f4",
                "tertiary-fixed": "#d8e2ff",
                "surface-container": "#e6eeff",
                "on-background": "#0d1c2f",
                "surface-bright": "#f8f9ff",
                "error-container": "#ffdad6",
                "on-primary-fixed-variant": "#3f465c",
                "on-secondary": "#ffffff",
                "inverse-on-surface": "#ebf1ff",
                "surface-container-high": "#dde9ff",
                "background": "#f8f9ff",
                "tertiary-fixed-dim": "#adc6ff",
                "tertiary-container": "#001a42",
                "secondary-fixed-dim": "#ffb3b6",
                "on-secondary-container": "#fffbff",
                "surface-container-low": "#eff4ff",
                "secondary": "#ba0035",
                "on-error-container": "#93000a",
                "tertiary": "#000000",
                "error": "#ba1a1a",
                "primary-container": "#131b2e",
                "on-primary-fixed": "#131b2e",
                "surface-container-highest": "#d5e3fd",
                "on-tertiary": "#ffffff"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "stack-lg": "24px",
                "stack-md": "16px",
                "section-gap": "40px",
                "margin-page": "20px",
                "stack-sm": "8px",
                "unit": "4px",
                "gutter": "16px"
        },
        "fontFamily": {
                "body-md": ["Inter"],
                "label-md": ["Inter"],
                "headline-lg": ["Inter"],
                "headline-md": ["Inter"],
                "headline-xl": ["Inter"],
                "label-caps": ["Inter"],
                "body-lg": ["Inter"]
        },
        "fontSize": {
                "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
        }
},
    },
  }
</script>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<header class="bg-surface shadow-sm text-primary flex justify-center items-center w-full px-margin-page h-16 docked full-width top-0 z-40 sticky"><div class="max-w-4xl w-full flex justify-end items-center"><a th:href="@{/perfil}"><img th:src="${session.usuarioLogueado != null && session.usuarioLogueado.fotoPerfil != null ? session.usuarioLogueado.fotoPerfil : 'https://lh3.googleusercontent.com/aida-public/AB6AXuAlbN9S2A0zqC0fJvJ86C9C9cGOoV3Zxyr8XzeUINauvRrs3tWHadLoPHFlXLJ6PqdYXcR8ZJioXLivH6Oep0LZj2aiBX2r_vX-DUuY1n5O30uV3W-66OGPc86YEAxOGTZOE1bfFjVtqoNVrVj0A1fvAFSFH9qAJel99qqU504DcoRLhn-Ju9apTZco83ArQNoVvZf9uWUNuHB06T3ixHX7VgLj_6_ovPowet0rowU6vOdENBhdV3dIoz9_3A45G5UouvhTEix_R-tn'}" alt="User Profile" class="w-10 h-10 rounded-full object-cover border border-outline-variant/30 hover:scale-105 transition-transform"></a></div></header>
<main class="flex-grow px-margin-page py-section-gap pb-32 max-w-4xl mx-auto w-full flex flex-col gap-section-gap">
<div class="w-full rounded-xl overflow-hidden shadow-sm h-48 md:h-64 relative bg-surface-container-high">
<img alt="" class="w-full h-full object-cover object-center absolute inset-0" src="montero.jpg">
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent"></div>
<div class="absolute bottom-0 left-0 p-stack-lg">
<h2 class="font-headline-xl text-headline-xl text-on-primary">Encuentra tu ruta</h2>
</div>
</div>
<section class="bg-surface-container-lowest rounded-xl p-stack-lg shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-outline-variant/20 flex flex-col gap-stack-lg relative overflow-hidden">
<div class="absolute top-0 left-0 bottom-0 w-1 bg-secondary rounded-l-xl"></div>
<form th:action="@{/viajes/buscar}" method="GET" class="flex flex-col gap-stack-lg w-full">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter relative">
<div class="flex flex-col gap-stack-sm relative z-10">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest font-bold">Origen</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" style="font-variation-settings: &quot;FILL&quot; 1;">trip_origin</span>
<input name="origen" th:value="${origenBuscado}" class="w-full bg-surface-container-low border border-outline-variant/30 text-on-surface font-body-lg text-body-lg rounded-lg pl-12 pr-4 h-12 focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors placeholder:text-on-surface-variant/60" placeholder="Ciudad o estación de salida" type="text" required>
</div>
</div>
<div class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 items-center justify-center w-8 h-8 bg-surface-container-lowest rounded-full border border-outline-variant/30 text-secondary mt-3">
<span class="material-symbols-outlined text-[20px]">swap_horiz</span>
</div>
<div class="flex flex-col gap-stack-sm relative z-10">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest font-bold">Destino</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary" style="font-variation-settings: &quot;FILL&quot; 1;">location_on</span>
<input name="destino" th:value="${destinoBuscado}" class="w-full bg-surface-container-low border border-outline-variant/30 text-on-surface font-body-lg text-body-lg rounded-lg pl-12 pr-4 h-12 focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors placeholder:text-on-surface-variant/60" placeholder="Ciudad o estación de llegada" type="text" required>
</div>
</div>
</div>
<hr class="border-outline-variant/20">
<div class="grid grid-cols-2 gap-gutter">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest font-bold">Fecha de ida</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">calendar_today</span>
<input name="fecha" th:value="${fechaBuscada}" class="w-full bg-surface-container-low border border-outline-variant/30 text-on-surface font-body-md text-body-md rounded-lg pl-10 pr-3 h-12 focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors" type="date" required>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest font-bold">Fecha de retorno</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">event_upcoming</span>
<input name="fechaRetorno" class="w-full bg-surface-container-low border border-outline-variant/30 text-on-surface font-body-md text-body-md rounded-lg pl-10 pr-3 h-12 focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-colors" type="date">
</div>
</div>
</div>
<button type="submit" class="mt-stack-sm w-full bg-secondary text-on-secondary font-headline-md text-headline-md py-stack-md rounded-xl hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">search</span>
                Buscar
            </button>
</form>
</section>
</main>
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-2 bg-surface-container-lowest border-t border-outline-variant shadow-lg">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/10 px-3 py-1 rounded-lg w-16" onmousedown="this.style.transform='scale(0.90)'" onmouseleave="this.style.transform='scale(1)'" onmouseup="this.style.transform='scale(1)'">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: &quot;FILL&quot; 0;">home</span>
<span class="font-label-md text-label-md">Inicio</span>
</button>
<button class="flex flex-col items-center justify-center text-secondary font-bold hover:bg-surface-variant/10 px-3 py-1 rounded-lg w-16" onmousedown="this.style.transform='scale(0.90)'" onmouseleave="this.style.transform='scale(1)'" onmouseup="this.style.transform='scale(1)'">
<span class="material-symbols-outlined mb-1" data-icon="search" style="font-variation-settings: &quot;FILL&quot; 1;">search</span>
<span class="font-label-md text-label-md">Buscar</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/10 px-3 py-1 rounded-lg w-16" onmousedown="this.style.transform='scale(0.90)'" onmouseleave="this.style.transform='scale(1)'" onmouseup="this.style.transform='scale(1)'">
<span class="material-symbols-outlined mb-1" data-icon="directions_transit" style="font-variation-settings: &quot;FILL&quot; 0;">directions_transit</span>
<span class="font-label-md text-label-md">MisViajes</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/10 px-3 py-1 rounded-lg w-16" onmousedown="this.style.transform='scale(0.90)'" onmouseleave="this.style.transform='scale(1)'" onmouseup="this.style.transform='scale(1)'">
<span class="material-symbols-outlined mb-1" data-icon="notifications" style="font-variation-settings: &quot;FILL&quot; 0;">notifications</span>
<span class="font-label-md text-label-md">Alertas</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/10 px-3 py-1 rounded-lg w-16" onmousedown="this.style.transform='scale(0.90)'" onmouseleave="this.style.transform='scale(1)'" onmouseup="this.style.transform='scale(1)'">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: &quot;FILL&quot; 0;">settings</span>
<span class="font-label-md text-label-md">Ajustes</span>
</button>
</nav>




</body></html>
