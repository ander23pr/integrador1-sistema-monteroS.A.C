<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Editar Perfil - Montero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#ffdada",
                    "surface": "#f8f9ff",
                    "surface-variant": "#d5e3fd",
                    "surface-container-lowest": "#ffffff",
                    "tertiary": "#000000",
                    "outline": "#76777d",
                    "inverse-on-surface": "#ebf1ff",
                    "tertiary-fixed": "#d8e2ff",
                    "primary-fixed": "#dae2fd",
                    "secondary-fixed-dim": "#ffb3b6",
                    "on-primary-fixed-variant": "#3f465c",
                    "on-error": "#ffffff",
                    "on-secondary-fixed-variant": "#920028",
                    "surface-container": "#e6eeff",
                    "surface-tint": "#565e74",
                    "inverse-surface": "#233144",
                    "surface-container-low": "#eff4ff",
                    "on-surface": "#0d1c2f",
                    "on-tertiary-fixed-variant": "#004395",
                    "surface-dim": "#ccdbf4",
                    "on-primary-fixed": "#131b2e",
                    "on-tertiary-container": "#3980f4",
                    "tertiary-container": "#001a42",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#dde9ff",
                    "primary-fixed-dim": "#bec6e0",
                    "primary-container": "#131b2e",
                    "on-tertiary-fixed": "#001a42",
                    "on-secondary-fixed": "#40000c",
                    "on-surface-variant": "#45464d",
                    "background": "#f8f9ff",
                    "inverse-primary": "#bec6e0",
                    "surface-container-highest": "#d5e3fd",
                    "primary": "#000000",
                    "outline-variant": "#c6c6cd",
                    "tertiary-fixed-dim": "#adc6ff",
                    "secondary": "#ba0035",
                    "on-secondary-container": "#fffbff",
                    "error-container": "#ffdad6",
                    "error": "#ba1a1a",
                    "surface-bright": "#f8f9ff",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#e21e49",
                    "on-background": "#0d1c2f",
                    "on-primary-container": "#7c839b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "stack-sm": "8px",
                    "stack-lg": "24px",
                    "stack-md": "16px",
                    "section-gap": "40px",
                    "margin-page": "20px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-xl": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "label-caps": ["Inter"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen">

<header class="w-full top-0 sticky z-50 bg-primary-container text-on-primary-fixed border-b border-outline-variant/10 shadow-sm h-16 flex items-center">
    <div class="flex items-center justify-between px-margin-page w-full max-w-7xl mx-auto">
        <div class="flex items-center gap-4">
            <button th:onclick="|window.location.href='@{/perfil}'|" class="active:scale-95 transition-transform hover:bg-surface-container-low/10 p-2 rounded-full">
                <span class="material-symbols-outlined text-on-primary">arrow_back</span>
            </button>
            <h1 class="font-headline-md text-on-primary">Editar Perfil</h1>
        </div>
    </div>
</header>

<main class="min-h-screen pb-20 px-4 pt-8">
    <section class="max-w-3xl mx-auto bg-white rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden relative p-6">
        <h2 class="text-2xl font-semibold mb-6">Actualizar Datos</h2>
        
        <form th:action="@{/perfil/actualizar}" method="post" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-outline mb-1">NOMBRE COMPLETO</label>
                    <input type="text" name="nombre" th:value="${perfil.nombre}" class="w-full rounded-md border-outline-variant/50 focus:border-secondary focus:ring-secondary" required>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-outline mb-1">DNI / PASAPORTE</label>
                    <input type="text" name="dni" th:value="${perfil.dni}" class="w-full rounded-md border-outline-variant/50 focus:border-secondary focus:ring-secondary">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-outline mb-1">TELÉFONO</label>
                    <input type="text" name="telefono" th:value="${perfil.telefono}" class="w-full rounded-md border-outline-variant/50 focus:border-secondary focus:ring-secondary">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-outline mb-1">ASIENTO PREFERIDO</label>
                    <select name="preferenciaAsiento" class="w-full rounded-md border-outline-variant/50 focus:border-secondary focus:ring-secondary">
                        <option value="">Seleccionar...</option>
                        <option value="Ventanilla" th:selected="${perfil.preferenciaAsiento == 'Ventanilla'}">Ventanilla</option>
                        <option value="Pasillo" th:selected="${perfil.preferenciaAsiento == 'Pasillo'}">Pasillo</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-outline mb-1">TIPO DE SERVICIO</label>
                    <select name="preferenciaServicio" class="w-full rounded-md border-outline-variant/50 focus:border-secondary focus:ring-secondary">
                        <option value="">Seleccionar...</option>
                        <option value="Regular" th:selected="${perfil.preferenciaServicio == 'Regular'}">Regular</option>
                        <option value="VIP" th:selected="${perfil.preferenciaServicio == 'VIP'}">VIP</option>
                        <option value="Premium" th:selected="${perfil.preferenciaServicio == 'Premium'}">Premium</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-4 pt-4">
                <a th:href="@{/perfil}" class="px-6 py-2 border border-outline-variant rounded-lg text-on-surface hover:bg-surface-container-low transition-colors">Cancelar</a>
                <button type="submit" class="px-6 py-2 bg-secondary text-on-secondary rounded-lg hover:opacity-90 transition-opacity">Guardar Cambios</button>
            </div>
        </form>
    </section>
</main>

</body></html>
