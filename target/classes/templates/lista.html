<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tituloPagina}">Alertas del Sistema</title>
    <!-- Importamos Tailwind CSS para que se vea moderno al instante -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="max-w-4xl mx-auto py-8 px-4">
        <!-- Encabezado -->
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-3xl font-bold text-gray-800" th:text="${tituloPagina}">Alertas</h1>
            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">Módulo Alertas</span>
        </div>

        <!-- Alerta de Prueba 1 -->
        <div class="bg-white p-5 rounded-lg shadow-md border-l-4 border-yellow-500 mb-4">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-lg font-semibold text-gray-900">⚠️ Stock Crítico de Repuestos</h3>
                    <p class="text-gray-600 mt-1 text-sm">El artículo 'Filtro de Aceite Montero' ha alcanzado el límite mínimo configurado.</p>
                </div>
                <span class="text-xs text-gray-400">Hace unos momentos</span>
            </div>
        </div>

        <!-- Alerta de Prueba 2 -->
        <div class="bg-white p-5 rounded-lg shadow-md border-l-4 border-blue-500">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-lg font-semibold text-gray-900">ℹ️ Nueva Reserva Registrada</h3>
                    <p class="text-gray-600 mt-1 text-sm">Se ha procesado exitosamente un nuevo pago correspondiente al flujo de gestión de viajes.</p>
                </div>
                <span class="text-xs text-gray-400">Ayer</span>
            </div>
        </div>
    </div>

</body>
</html>
