<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pagar Transacción - Montenero</title>
<!-- Load Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Load Inter Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#76777d",
                        "on-surface-variant": "#45464d",
                        "on-primary-fixed": "#131b2e",
                        "surface": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#adc6ff",
                        "secondary-fixed": "#ffdada",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#bec6e0",
                        "tertiary-fixed": "#d8e2ff",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary": "#000000",
                        "on-tertiary-fixed": "#001a42",
                        "on-secondary-fixed-variant": "#920028",
                        "primary-fixed": "#dae2fd",
                        "surface-container-highest": "#d5e3fd",
                        "inverse-on-surface": "#ebf1ff",
                        "surface-dim": "#ccdbf4",
                        "on-tertiary-fixed-variant": "#004395",
                        "on-secondary-fixed": "#40000c",
                        "outline-variant": "#c6c6cd",
                        "surface-container-high": "#dde9ff",
                        "inverse-primary": "#bec6e0",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "background": "#f8f9ff",
                        "tertiary-container": "#001a42",
                        "surface-container": "#e6eeff",
                        "surface-container-low": "#eff4ff",
                        "secondary-fixed-dim": "#ffb3b6",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-tint": "#565e74",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#0d1c2f",
                        "surface-bright": "#f8f9ff",
                        "on-error": "#ffffff",
                        "secondary-container": "#e21e49",
                        "primary-container": "#131b2e",
                        "inverse-surface": "#233144",
                        "on-surface": "#0d1c2f",
                        "on-tertiary-container": "#3980f4",
                        "primary": "#131b2e",
                        "surface-variant": "#d5e3fd",
                        "secondary": "#ba0035",
                        "on-primary-container": "#7c839b",
                        "on-secondary-container": "#fffbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }

<style data-purpose="custom-layout">
        body {
            background-color: #f8f9ff;
        }
        .form-input-line {
            border: none;
            border-bottom: 1.5px solid #E2E8F0;
            padding: 8px 0;
            border-radius: 0;
            background: transparent;
            width: 100%;
            transition: border-color 0.2s;
        }
        .form-input-line:focus {
            border-bottom-color: #131b2e;
            ring: 0;
            outline: none;
            box-shadow: none;
        }
        .custom-toggle {
            width: 44px;
            height: 24px;
            background-color: #CBD5E1;
            border-radius: 999px;
            position: relative;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .custom-toggle.active {
            background-color: #131b2e;
        }
        .custom-toggle-dot {
            width: 18px;
            height: 18px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }
        .custom-toggle.active .custom-toggle-dot {
            transform: translateX(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="max-w-[390px] mx-auto min-h-screen bg-white shadow-2xl overflow-x-hidden font-sans">
<!-- BEGIN: MainHeader -->
<header class="bg-primary-container text-white p-5 flex justify-between items-center sticky top-0 z-50">
<div class="flex items-center gap-3">
<h1 class="text-lg font-semibold tracking-tight">Pagar Transacción</h1>
</div>
<button aria-label="Cerrar" class="hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- END: MainHeader -->
<main class="pb-32">
<!-- BEGIN: TripSummary -->
<div class="px-5 pt-6 pb-2" data-purpose="trip-summary-container">
<div class="bg-surface-container-lowest border border-surface-container-high shadow-[0_8px_24px_-10px_rgba(0,0,0,0.1)] rounded-xl p-5 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1.5 h-full bg-primary-container"></div>
<div class="flex flex-col gap-1">
<p class="text-[11px] text-on-surface-variant uppercase font-bold tracking-[0.1em]">Total a pagar</p>
<p class="text-3xl font-extrabold text-on-surface tracking-tight">S/. 450.00</p>
<div class="flex items-center gap-2 mt-2 text-[13px] text-on-surface-variant font-medium">
<span class="material-symbols-outlined text-[18px]">work_history</span>
<span>Piura - Trujillo • 1 Pasajero</span>
</div>
</div>
</div>
</div>
<!-- END: TripSummary -->
<!-- BEGIN: PaymentMethods -->
<!-- Payment Methods -->
<section class="mt-6 mb-8">

    <h2 class="font-body-lg text-[#004395] font-semibold mb-4">
        Seleccione la forma de pago
    </h2>

    <style>
        .payment-btn{
            transition:.25s;
        }

        .payment-btn:hover{
            transform:translateY(-1px);
        }

        .payment-btn-active{
            background:#004395;
            color:#fff;
            border-color:#004395;
            box-shadow:0 4px 10px rgba(0,67,149,.18);
        }

        .payment-btn .material-symbols-outlined{
            font-size:20px;
        }
    </style>

    <div class="grid grid-cols-2 gap-3">

        <!-- Tarjeta -->
        <a th:href="@{/pagos/tarjeta/{id}(id=${reserva.id})}"
           class="payment-btn payment-btn-active flex items-center justify-center gap-2 rounded-xl border px-4 py-3 font-medium">

            <span class="material-symbols-outlined">
                credit_card
            </span>

            Tarjeta

        </a>

        <!-- Yape -->
        <a th:href="@{/pagos/yape/{id}(id=${reserva.id})}"
           class="payment-btn flex items-center justify-center gap-2 rounded-xl border border-outline-variant bg-white text-[#004395] px-4 py-3 font-medium">

            <span class="material-symbols-outlined">
                smartphone
            </span>

            Yape

        </a>

        <!-- PagoEfectivo -->
        <a th:href="@{/pagos/pagoefectivo/{id}(id=${reserva.id})}"
           class="payment-btn flex items-center justify-center gap-2 rounded-xl border border-outline-variant bg-white text-[#004395] px-4 py-3 font-medium">

            <span class="material-symbols-outlined">
                payments
            </span>

            PagoEfectivo

        </a>

        <!-- QR -->
        <a th:href="@{/pagos/qr/{id}(id=${reserva.id})}"
           class="payment-btn flex items-center justify-center gap-2 rounded-xl border border-outline-variant bg-white text-[#004395] px-4 py-3 font-medium">

            <span class="material-symbols-outlined">
                qr_code_2
            </span>

            Pago QR

        </a>

    </div>

</section>
<!-- END: PaymentMethods -->
<!-- BEGIN: CardForm -->
<section class="px-5 py-4 border-t border-surface-container">
<div class="flex justify-between items-center mb-6">
<h3 class="text-[13px] font-bold text-on-tertiary-container uppercase tracking-wider">Ingrese datos de la tarjeta</h3>
</div>
<!-- Network Logos -->
<div class="flex items-center gap-5 mb-8 justify-center opacity-90">
<img alt="Niubiz" class="h-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGi_nKF9RGkvWsTyjh_WAdCXfUlO74nrcsH7a5TxIDDhD7yx_3G1FogqKfiTU0304LH3Xms7IRN__39tDb6qtnnKskxkMLCDbXBkMcoKMGy-W7SNzIrFsUXSSdxpW3-rQ_Z_XVrNFOGPRYPaw9XtyNlke1_Dp5Hi2xX_EfbUccHDn__wqhlKN4EmFrHClR47rOuyvJuBRZu4zoklie6NLUJ4I2oZjUgWpSTcgzmEcWk0PwzJhSLY0fviGemTdqCF5a7XMTs3tKQv3A"/>
<img alt="Visa" class="h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAar0UdpaJ3x6QBKqDynaoNKkvvRyFmoLtB90qruF60KFwmomeMdlTQWbQhlDXx3pgJh3FvGgSv661BEqw134xAq0htt5eKIFXD3v8PHIp9YuWSE0a68803AWmVfzj1mhNwwhIZ-agq2QI276RIrjECfK5OUfQimQBZYFzDmy3vq3F09e3lNZwfl4cQQoCTZNNDmjRsW3XCCxiw9MFCdaawOdowugTIqry5Cc47cCUubhafz_PT0fXFvKMZf0NIgpzyUdPqvijjKbMV"/>
<img alt="Mastercard" class="h-8" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDikOgbRQa7PYcDJwtnQbye8V3aQ2Js94Cmw7F0qShNkh3x1H2wDhcQEiHDFCcoyLiQ0zoN-oeqzmaqXiju7svDzT5W_V6e7lfUA8DgDtGkWB8DwZIRFifDCzGibp8hfPC3uAOTse185wrRWIkkQu38u3o5njG7B4MA6TtCQsTUwKnda1R1NO1T1fnVM8tC1P3HuqlNsPMdi1Ju3jN5SM3P8rb09dygJLhoM9uNfft7y1s5ML2P4jB29j060Z5cvW7RkgZaBkkBEZLp"/>
<img alt="Amex" class="h-8" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDkoyekhuwE56vZkF_Fpcm_rOCuyZG9SfqihnMsWJEECTVd3YZhI1Qo8kIGoCUoHheJYsMlqTrJopv6W7_BRWF8ydgVN4mCC-592UIGjnpC7u8EYwsM4g5tvLUTBtmw69syInlfihHOGarHIrwy1Gvmd5RaR7SAG6FRnUgTzj8msPayrdwO_q_zVKxYmadm8w3mV__9rxVSpVc83y35wCBQC2Fit3GzJQBSRD3ZeGq4A0M4zzHDhDUlmuyfLgQZ72c8v0rjUClLJeI_"/>
</div>
<form class="space-y-8">
<!-- Card Number -->
<div class="relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Número de Tarjeta</label>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">credit_card</span>
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="0000 0000 0000 0000" type="text"/>
</div>
</div>
<!-- Expiry and CVV -->
<div class="flex gap-8">
<div class="flex-1 relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Expira (MM/AA)</label>
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="MM / AA" type="text"/>
</div>
<div class="flex-1 relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">CVV</label>
<div class="flex items-center gap-2">
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="123" type="password"/>
<span class="material-symbols-outlined text-outline text-[20px]">visibility</span>
</div>
</div>
</div>
<!-- User Data Toggle -->
<div class="flex justify-between items-center py-2 bg-surface-container-low px-3 rounded-lg -mx-3">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary">person</span>
<span class="text-sm font-semibold text-on-surface">Usar datos del pagador</span>
</div>
<div class="custom-toggle active" data-purpose="toggle-switch">
<div class="custom-toggle-dot"></div>
</div>
</div>
<!-- Document Type & ID -->
<div class="flex gap-5">
<div class="w-1/3 relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Tipo</label>
<div class="relative">
<select class="form-input-line text-on-surface text-base appearance-none bg-transparent pr-8">
<option>DNI</option>
<option>CE</option>
<option>PAS</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<div class="flex-1 relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Nro. Documento</label>
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="Ingrese número" type="text"/>
</div>
</div>
<!-- Personal Details -->
<div class="grid grid-cols-1 gap-8">
<div class="relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Nombres</label>
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="Ej. Juan" type="text"/>
</div>
<div class="relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Apellidos</label>
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="Ej. Perez" type="text"/>
</div>
<div class="relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Correo Electrónico</label>
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="tucorreo@ejemplo.com" type="email"/>
</div>
<div class="relative pt-4">
<label class="text-[11px] text-on-surface-variant uppercase font-bold absolute top-0 left-0">Teléfono</label>
<input class="form-input-line text-on-surface text-base placeholder:text-outline-variant" placeholder="999 999 999" type="tel"/>
</div>
</div>
</form>
</section>
<!-- END: CardForm -->
<!-- BEGIN: Compliance -->
<section class="px-5 mt-6 mb-10">
<div class="flex items-start gap-3 bg-green-50/50 p-4 rounded-xl border border-green-100">
<input class="mt-0.5 h-5 w-5 rounded border-green-300 text-primary-container focus:ring-primary-container cursor-pointer" id="terms" type="checkbox"/>
<label class="text-[12px] text-on-surface-variant leading-relaxed font-medium" for="terms">
                    Acepto los requisitos de viaje y los 
                    <a class="text-on-tertiary-container font-bold hover:underline" href="#">Términos y Condiciones</a>.
                    <div class="mt-2 flex flex-col gap-1.5">
<a class="text-on-tertiary-container flex items-center gap-1 hover:underline" href="#">
<span class="material-symbols-outlined text-[14px]">info</span>
                            Requisitos para el pasajero
                        </a>
</div>
</label>
</div>
</section>
<!-- END: Compliance -->
</main>
<!-- BEGIN: StickyFooter -->
<footer class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto bg-white border-t border-surface-container-high p-5 flex gap-4 z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.08)]">
<button class="flex-1 py-4 px-4 border border-surface-container-high rounded-xl text-sm font-bold text-on-surface-variant hover:bg-surface transition-colors">
            Cancelar
        </button>
<button class="flex-[2] py-4 px-6 bg-primary-container text-white rounded-xl text-sm font-bold hover:bg-on-tertiary-fixed transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-[18px]">lock</span>
            Pagar S/. 450.00
        </button>
</footer>
<!-- END: StickyFooter -->
</body></html>
