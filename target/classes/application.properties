spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/montero_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:soldepiura}

# Hibernate: crear/actualizar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ejecutar data.sql después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Puerto del servidor
server.port=8080

# Thymeleaf: desactivar cache en desarrollo para ver cambios en tiempo real
spring.thymeleaf.cache=false